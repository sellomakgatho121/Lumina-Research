services:
  - type: web
    name: lumina-research
    runtime: static
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_DEEPSEEK_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
